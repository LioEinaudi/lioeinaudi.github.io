{%- assign toc_label = "Table of contents" -%}
{%- if page.lang == "zh" -%}{%- assign toc_label = "目录" -%}{%- endif -%}
<nav class="toc" aria-label="{{ toc_label }}" hidden>
  <button class="toc-toggle" type="button" aria-controls="toc-list" aria-expanded="false">{{ toc_label }}</button>
  <ul id="toc-list"></ul>
</nav>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var content = document.querySelector('.post-content');
    var toc = document.querySelector('.toc');
    if (!content || !toc) return;
    var heads = content.querySelectorAll('h2[id], h3[id]');
    if (heads.length < 2) { toc.remove(); return; }
    var ul = toc.querySelector('ul');
    heads.forEach(function (h) {
      var li = document.createElement('li');
      li.className = 'toc-' + h.tagName.toLowerCase();
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      li.appendChild(a);
      ul.appendChild(li);
    });
    var toggle = toc.querySelector('button');
    toggle.addEventListener('click', function () {
      toggle.setAttribute('aria-expanded', toggle.getAttribute('aria-expanded') === 'false');
    });
    toc.hidden = false;
    var links = toc.querySelectorAll('a');
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          links.forEach(function (l) {
            l.classList.toggle('active', l.getAttribute('href') === '#' + e.target.id);
          });
        }
      });
    }, { rootMargin: '0px 0px -70% 0px' });
    heads.forEach(function (h) { obs.observe(h); });
  });
</script>
