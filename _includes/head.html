<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <script>
    function applyThemePreference(theme) {
      if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
      else delete document.documentElement.dataset.theme;
      document.querySelector('meta[name="color-scheme"]').content = document.documentElement.dataset.theme || 'light dark';
    }
    try { applyThemePreference(localStorage.getItem('theme')); } catch (error) {}
  </script>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  {%- assign build_time = site.time | date: "%s" -%}
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}?v={{ site.github.build_revision | default: build_time | url_encode }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
